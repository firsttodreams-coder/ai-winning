name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install API test dependencies
        run: python -m pip install --upgrade pip fastapi httpx pydantic pytest
      - name: Check inline frontend JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.IGNORECASE | re.DOTALL)
          if not scripts:
              raise SystemExit("No inline script found in index.html")
          Path("/tmp/ai-winning-inline.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/ai-winning-inline.js
      - name: Run API tests
        run: python -m pytest -q
